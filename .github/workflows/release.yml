name: Release

# Builds prebuilt qgate binaries and publishes them to a GitHub Release.
#
# Two ways to cut a release:
#   1. Push a tag:      git tag v0.1.0 && git push origin v0.1.0
#   2. Run it by hand:  gh workflow run release.yml -f tag=v0.1.0
#      (or Actions > Release > Run workflow). GitHub creates the tag on the
#      commit the workflow ran from.
#
# The tag must match the version in Cargo.toml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0 (must match Cargo.toml)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version v$version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          cargo test --locked

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=qgate-${{ matrix.target }}
          tar -czf "$name.tar.gz" -C target/${{ matrix.target }}/release qgate
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: qgate-${{ matrix.target }}
          path: qgate-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh dist/
          # Hand-written notes in docs/releases/<tag>.md come first when present.
          notes=(--generate-notes)
          if [ -f "docs/releases/$TAG.md" ]; then
            notes+=(--notes-file "docs/releases/$TAG.md")
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" "${notes[@]}"
          fi
